<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1140 640" role="img" aria-labelledby="t d" font-family="Inter, system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title id="t">Your repo becomes a workspace</title>
  <desc id="d">GitHub repositories flow into an isolated container workspace, which opens in the browser as a file tree, editor and terminal.</desc>

  <defs>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#1d6fd1" stop-opacity=".12"/>
      <stop offset="1" stop-color="#1d6fd1" stop-opacity="0"/>
    </radialGradient>
    <filter id="cardShadow" x="-25%" y="-30%" width="150%" height="180%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0b1220" flood-opacity="0.10"/>
    </filter>
  </defs>

  <style>
    .card { fill: #ffffff; stroke: #e6eaf1; stroke-width: 1.2; filter: url(#cardShadow); }
    .h { font-size: 14px; font-weight: 700; fill: #0b1220; }
    .name { font-size: 13px; font-weight: 600; fill: #0b1220; }
    .sub { font-size: 12px; fill: #5a6474; }
    .label { font-size: 13px; fill: #5a6474; }
    .badge { font-size: 10px; font-weight: 700; letter-spacing: .8px; text-anchor: end; fill: #5a6474; }
    .line { fill: none; stroke-width: 1.4; stroke-dasharray: 6 6; animation: flow 1.4s linear infinite; }
    .l { stroke: #7db9f5; }
    .r { stroke: #74d39b; }
    .node { fill: #f4f6fa; stroke-width: 1.4; }
    .step { font-size: 13px; font-weight: 600; fill: #0b1220; }
    @keyframes flow { to { stroke-dashoffset: -24; } }
    @media (prefers-reduced-motion: reduce) {
      .line { animation: none; }
      .dot, .pulse { display: none; }
    }
  </style>

  <!-- soft glow (background is transparent: sits straight on the page) -->
  <circle cx="570" cy="300" r="260" fill="url(#glow)"/>

  <!-- title -->
  <text x="570" y="56" text-anchor="middle" font-size="28" font-weight="700" fill="#0b1220">Your repo becomes a workspace</text>

  <text class="label" x="56" y="118">Your GitHub repos</text>
  <text class="label" x="838" y="118">Browser IDE</text>

  <!-- left paths -->
  <path class="line l" d="M290 176 C395 176 395 296 498 296"/>
  <path class="line l" d="M290 262 C395 262 395 301 498 301"/>
  <path class="line l" d="M290 348 C395 348 395 306 498 306"/>
  <path class="line l" d="M290 434 C395 434 395 311 498 311"/>
  <!-- right paths -->
  <path class="line r" d="M642 296 C735 296 735 195 820 195"/>
  <path class="line r" d="M642 303 C735 303 735 320 820 320"/>
  <path class="line r" d="M642 310 C735 310 735 445 820 445"/>

  <!-- edge nodes -->
  <circle class="node" cx="290" cy="176" r="4" stroke="#7db9f5"/>
  <circle class="node" cx="290" cy="262" r="4" stroke="#7db9f5"/>
  <circle class="node" cx="290" cy="348" r="4" stroke="#7db9f5"/>
  <circle class="node" cx="290" cy="434" r="4" stroke="#7db9f5"/>
  <circle class="node" cx="820" cy="195" r="4" stroke="#74d39b"/>
  <circle class="node" cx="820" cy="320" r="4" stroke="#74d39b"/>
  <circle class="node" cx="820" cy="445" r="4" stroke="#74d39b"/>

  <!-- travelling dots: left -->
  <circle class="dot" r="3.5" fill="#1d6fd1"><animateMotion dur="3.6s" begin="0s" repeatCount="indefinite" path="M290 176 C395 176 395 296 498 296"/><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.1;.9;1" dur="3.6s" begin="0s" repeatCount="indefinite"/></circle>
  <circle class="dot" r="3.5" fill="#1d6fd1"><animateMotion dur="3.6s" begin="0.9s" repeatCount="indefinite" path="M290 262 C395 262 395 301 498 301"/><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.1;.9;1" dur="3.6s" begin="0.9s" repeatCount="indefinite"/></circle>
  <circle class="dot" r="3.5" fill="#1d6fd1"><animateMotion dur="3.6s" begin="1.8s" repeatCount="indefinite" path="M290 348 C395 348 395 306 498 306"/><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.1;.9;1" dur="3.6s" begin="1.8s" repeatCount="indefinite"/></circle>
  <circle class="dot" r="3.5" fill="#1d6fd1"><animateMotion dur="3.6s" begin="2.7s" repeatCount="indefinite" path="M290 434 C395 434 395 311 498 311"/><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.1;.9;1" dur="3.6s" begin="2.7s" repeatCount="indefinite"/></circle>
  <!-- travelling dots: right -->
  <circle class="dot" r="3.5" fill="#16a34a"><animateMotion dur="3s" begin="0.4s" repeatCount="indefinite" path="M642 296 C735 296 735 195 820 195"/><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.1;.9;1" dur="3s" begin="0.4s" repeatCount="indefinite"/></circle>
  <circle class="dot" r="3.5" fill="#16a34a"><animateMotion dur="3s" begin="1.4s" repeatCount="indefinite" path="M642 303 C735 303 735 320 820 320"/><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.1;.9;1" dur="3s" begin="1.4s" repeatCount="indefinite"/></circle>
  <circle class="dot" r="3.5" fill="#16a34a"><animateMotion dur="3s" begin="2.4s" repeatCount="indefinite" path="M642 310 C735 310 735 445 820 445"/><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.1;.9;1" dur="3s" begin="2.4s" repeatCount="indefinite"/></circle>

  <!-- hub -->
  <circle class="pulse" cx="570" cy="300" r="82" fill="none" stroke="#1d6fd1" stroke-width="1.2" opacity="0">
    <animate attributeName="r" values="76;150" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values=".35;0" dur="4s" repeatCount="indefinite"/>
  </circle>
  <circle class="pulse" cx="570" cy="300" r="82" fill="none" stroke="#1d6fd1" stroke-width="1.2" opacity="0">
    <animate attributeName="r" values="76;150" dur="4s" begin="2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values=".35;0" dur="4s" begin="2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="570" cy="300" r="72" fill="#eff6ff" stroke="#dbe7f7" stroke-width="1.5"/>
  <circle cx="570" cy="300" r="60" fill="none" stroke="#cfe3fb" stroke-width="1"/>
  <text x="570" y="296" text-anchor="middle" font-size="14" font-weight="700" fill="#0b1220">Workspace</text>
  <text x="570" y="316" text-anchor="middle" font-size="10" font-weight="600" letter-spacing="1.4" fill="#5a6474">ISOLATED</text>

  <text x="570" y="424" text-anchor="middle" font-size="17" font-weight="700" fill="#0b1220">Each repo gets its own container</text>
  <text x="570" y="450" text-anchor="middle" font-size="12.5" fill="#5a6474">CPU and memory limits, disposable,</text>
  <text x="570" y="468" text-anchor="middle" font-size="12.5" fill="#5a6474">nothing installed on your machine.</text>

  <!-- left: repos -->
  <rect class="card" x="40" y="140" width="250" height="72" rx="14"/>
  <text class="h" x="56" y="174">api-server</text><text class="sub" x="56" y="194">TypeScript, Express</text>

  <rect class="card" x="40" y="226" width="250" height="72" rx="14"/>
  <text class="h" x="56" y="260">ml-notebooks</text><text class="sub" x="56" y="280">Python, Jupyter</text>

  <rect class="card" x="40" y="312" width="250" height="72" rx="14"/>
  <text class="h" x="56" y="346">portfolio-site</text><text class="sub" x="56" y="366">Next.js, Tailwind</text>

  <rect class="card" x="40" y="398" width="250" height="72" rx="14"/>
  <text class="h" x="56" y="432">dotfiles</text><text class="sub" x="56" y="452">Shell, config</text>

  <!-- right: browser IDE -->
  <rect class="card" x="820" y="140" width="280" height="110" rx="14"/>
  <text class="name" x="838" y="180">File tree</text>
  <text class="badge" x="1084" y="180">IMPORTED</text>
  <text class="h" x="838" y="218">api-server/src</text>
  <text class="sub" x="838" y="238">12 files imported from GitHub</text>

  <rect class="card" x="820" y="265" width="280" height="110" rx="14"/>
  <text class="name" x="838" y="305">Editor</text>
  <text class="badge" x="1084" y="305">LIVE</text>
  <text class="h" x="838" y="343">index.ts</text>
  <text class="sub" x="838" y="363">Monaco editor in your browser</text>

  <rect class="card" x="820" y="390" width="280" height="110" rx="14"/>
  <text class="name" x="838" y="430">Terminal</text>
  <text class="badge" x="1084" y="430">RUNNING</text>
  <text class="h" x="838" y="468">npm run dev</text>
  <text class="sub" x="838" y="488">Ready on localhost:3000</text>

  <!-- bottom steps -->
  <path d="M56 545 H1084 M56 615 H1084" stroke="#e6eaf1" stroke-width="1.2"/>
  <text class="step" x="340" y="585" text-anchor="middle">Sign in with GitHub</text>
  <path d="M440 580 H476 M468 574 L476 580 L468 586" fill="none" stroke="#9aa4b2" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  <text class="step" x="570" y="585" text-anchor="middle">Import a repo</text>
  <path d="M650 580 H686 M678 574 L686 580 L678 586" fill="none" stroke="#9aa4b2" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  <text class="step" x="810" y="585" text-anchor="middle">Open in browser</text>
</svg>
