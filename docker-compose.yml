services:
  postgres:
    image: postgres:17-alpine
    container_name: db
    restart: always

    ports:
      - "5431:5432"

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres

    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: redis
    restart: unless-stopped

    ports:
      - "127.0.0.1:6379:6379"

    command: redis-server --appendonly yes

    volumes:
      - redis-data:/data

  minio:
    # MinIO stopped publishing to Docker Hub in Oct 2025 (repo is source-only
    # now); coollabsio/minio rebuilds official releases automatically.
    image: coollabsio/minio:latest
    container_name: minio
    restart: unless-stopped

    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"

    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin

    command: server /data --console-address ":9001"

    volumes:
      - minio_data:/data

volumes:
  postgres_data:

  redis-data:
    name: redis-data

  minio_data:
    name: minio_data